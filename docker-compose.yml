# ASTRA — AD-6: docker runs the platform's services (postgres, redis, api).
# The frontend (web/) runs locally with hot reload.
# `name:` pins the compose project so containers/volumes/networks are always
# astra-* regardless of what this folder happens to be called.
name: astra

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: astra
    ports:
      # 5433: host port 5432 is already taken by a local PostgreSQL service on this machine
      # Day 4 (audit S3): localhost-only — venue Wi-Fi must never reach the DB.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d astra"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/astra
      REDIS_URL: redis://redis:6379/0
      # Day 4 (S2): fail fast when the secret is unset — code/.env must set it.
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in code/.env (see api/.env.example)}
      # Day 4 (S1): demo-login endpoint gate — true only on the demo machine.
      DEMO_MODE: ${DEMO_MODE:-false}
      ENVIRONMENT: development
    volumes:
      - ./api:/app
      # keep the Windows-built venv out of the Linux container's way
      - /app/.venv
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
